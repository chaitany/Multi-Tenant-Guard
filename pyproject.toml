[project]
name = "multi-tenant-guard"
version = "0.1.0"
description = "A backend-heavy API that manages organizational hierarchies, granular permissions (Role-Based Access Control), and strictly isolated data for different \"Tenants\" (companies)."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.129.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn>=0.41.0",
]
