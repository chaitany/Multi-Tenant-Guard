# Render Blueprint: Express + React UI (primary demo) and the FastAPI implementation of the same API.
# Both share one external Postgres (e.g. Neon); paste its URL when prompted.
services:
  - type: web
    name: tenantguard
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx drizzle-kit push --force && npm run build
    startCommand: npm start
    healthCheckPath: /api/tenants
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false

  - type: web
    name: tenantguard-fastapi
    runtime: python
    plan: free
    buildCommand: uv sync --frozen
    startCommand: uv run --frozen uvicorn fastapi_app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
